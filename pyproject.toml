[project]
name = "roottrace"
version = "0.1.0"
description = "Evidence-grounded multi-agent Root Cause Analysis for Python repositories"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0,<3",
    "numpy>=1.26,<3",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.0,<3",
    "scikit-learn>=1.5,<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.9"
]

[project.scripts]
roottrace = "roottrace.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["roottrace*"]
namespaces = false
